name: Quality and security gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # RUSTSEC-2026-0367/0368/0369: the zip crate's extract() path, pulled in transitively by
      # tauri-plugin-updater (pinned to the zip ^4 line) to unpack signed update bundles. No 4.x
      # release backports the fix and tauri-plugin-updater has not yet moved to zip >=9, so there
      # is no compatible version to update to (confirmed via `cargo update -p zip --dry-run`,
      # 2026-10-25). Exploiting these requires getting past the updater's own Ed25519 signature
      # check first. Remove this ignore list once tauri-plugin-updater ships on a patched zip.
      - name: Audit all native application lockfiles
        run: |
          IGNORE="--ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369"
          cargo audit $IGNORE --file apps/restaurant-system/pos/src-tauri/Cargo.lock
          cargo audit $IGNORE --file apps/restaurant-system/pos-admin/src-tauri/Cargo.lock
          cargo audit $IGNORE --file apps/restaurant-system/captain/src-tauri/Cargo.lock
          cargo audit $IGNORE --file apps/restaurant-system/kds/src-tauri/Cargo.lock
          cargo audit $IGNORE --file apps/kiosk-system/kiosk-user/src-tauri/Cargo.lock
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-admin
          POSTGRES_DB: jamanvaar_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-only-disposable-secret-gQ28rxSb92nz3pmY
      DATABASE_URL: postgresql://jamanvaar_ci:ci-disposable-app@localhost:5432/jamanvaar_ci_test
      TEST_DATABASE_URL: postgresql://jamanvaar_ci:ci-disposable-app@localhost:5432/jamanvaar_ci_test
      SEED_DEMO_DATA: 'false'
      SEED_SUPER_ADMIN_EMAIL: ci-platform@example.invalid
      SEED_SUPER_ADMIN_PASSWORD: CI-only-disposable-Password-28!
      SMTP_HOST: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create a non-bypass QA database role
        env:
          PGPASSWORD: ci-disposable-admin
        run: |
          psql -h localhost -U postgres -d jamanvaar_ci_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE jamanvaar_ci LOGIN PASSWORD 'ci-disposable-app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE jamanvaar_ci_test OWNER TO jamanvaar_ci;
          ALTER SCHEMA public OWNER TO jamanvaar_ci;
          SQL
      - run: npm run prisma:deploy --workspace=@jamanvaar/cloud-api
      - run: npm run seed --workspace=@jamanvaar/cloud-api
      - run: npm run typecheck --workspace=@jamanvaar/cloud-api
      - run: npx tsc --noEmit
      # New gate (2026-10-13): the codebase predates this config, so there's a real existing
      # baseline -- 637 lint problems, 913 files not matching the new Prettier config. Informational
      # for now (continue-on-error) so this surfaces drift in every PR without blocking unrelated
      # work on a backlog nobody has triaged yet. Flip to blocking once that backlog is cleared.
      - name: Lint (informational -- see comment above)
        run: npm run lint
        continue-on-error: true
      - name: Format check (informational -- see comment above)
        run: npm run format:check
        continue-on-error: true
      - run: npm test -- --maxWorkers=2
      - run: npm run test:cloud-api
      - run: npm run build --workspace=@jamanvaar/cloud-api
      - name: Receipt and backup PDF packaging smoke
        run: node tooling/qa/receipt-pdf-smoke.cjs
      - run: npm run build --workspace=@jamanvaar/super-admin-web
      - run: npm run build --workspace=@jamanvaar/pos-admin
      - run: npm run build --workspace=@jamanvaar/pos
      - run: npm run build --workspace=@jamanvaar/captain
      - run: npm run build --workspace=@jamanvaar/kds
      - run: npm run build --workspace=@jamanvaar/kiosk-user
      - run: npm run build --workspace=@jamanvaar/qr-guest
      - name: No high or critical production npm advisories
        run: node .github/scripts/npm-audit-allowlist.mjs
      - name: Produce dependency SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-sbom
          path: sbom.cdx.json
