name: Build Desktop Installers

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app names to build (POS, RestaurantAdmin, Kiosk, Captain, KDS), or "all"'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-security.yml

  # Filters the five-app matrix down to just what this run asked for -- fixing one app
  # doesn't need to rebuild (and re-sign, re-release) all five every time.
  setup:
    runs-on: ubuntu-latest
    outputs:
      desktop_matrix: ${{ steps.filter.outputs.desktop_matrix }}
      android_matrix: ${{ steps.filter.outputs.android_matrix }}
      apps_csv: ${{ steps.filter.outputs.apps_csv }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: filter
        env:
          APPS_INPUT: ${{ github.event.inputs.apps }}
        run: node .github/scripts/filter-build-matrix.mjs

  build-desktop:
    needs: [setup, quality]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Private updater key remains on a restricted signing machine, never GitHub Secrets.
    # Only trusted workflow_dispatch/default-branch jobs may use this runner/environment.
    runs-on: [self-hosted, Windows, X64, jamanvaar-signing]
    environment: native-release-signing
    # Job-level, not per-step: tauri.conf.json's beforeBuildCommand re-runs "npm run build"
    # a SECOND time, unattended, inside `tauri build` itself -- a step-scoped env block on
    # only the first "npm run build" step left that second, silent rebuild unconfigured,
    # which overwrote the correctly-built frontend with one defaulting to localhost:4000
    # right before bundling it into the installer. Every step in this job needs these.
    env:
      VITE_CLOUD_API_BASE_URL: ${{ vars.VITE_CLOUD_API_BASE_URL }}
      VITE_QR_ORDER_URL: ${{ vars.VITE_QR_ORDER_URL }}
      WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.desktop_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if ("${{ github.ref }}" -ne 'refs/heads/main') { throw 'Signing is restricted to main' }
          $env:TAURI_SIGNING_PRIVATE_KEY = [Environment]::GetEnvironmentVariable('JAMANVAAR_UPDATER_KEY_PATH', 'Machine')
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = [Environment]::GetEnvironmentVariable('JAMANVAAR_UPDATER_KEY_PASSWORD', 'Machine')
          node .github/scripts/validate-release-config.mjs windows
          if ($LASTEXITCODE -ne 0) { throw 'Release configuration is invalid' }

      - name: Install workspace dependencies
        run: npm ci

      - name: Build frontend (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Reject unverified prebuilt Local Core
        run: node .github/scripts/validate-sidecar-provenance.mjs "${{ matrix.app.path }}"

      - name: Build Tauri installer (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        # Sign inner binaries and installer with Authenticode BEFORE Tauri produces updater signatures.
        shell: pwsh
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY = [Environment]::GetEnvironmentVariable('JAMANVAAR_UPDATER_KEY_PATH', 'Machine')
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = [Environment]::GetEnvironmentVariable('JAMANVAAR_UPDATER_KEY_PASSWORD', 'Machine')
          $signer = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/sign-windows.ps1'
          $config = @{ bundle = @{ windows = @{ signCommand = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$signer`" -File `"%1`"" } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 signing-config.json
          npx --yes "@tauri-apps/cli@2.11.4" build --config signing-config.json --bundles nsis --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Signed Tauri build failed' }
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if (!$installer) { throw 'No signed installer produced' }
          foreach ($file in $installer) {
            if ((Get-AuthenticodeSignature -LiteralPath $file.FullName).Status -ne 'Valid') { throw 'Unsigned or invalid installer' }
            if (!(Test-Path -LiteralPath ($file.FullName+'.sig'))) { throw 'Missing updater signature' }
          }

      - name: Smoke test (${{ matrix.app.name }})
        shell: pwsh
        run: |
          $binaryPath = Join-Path "${{ matrix.app.path }}" "src-tauri/target/x86_64-pc-windows-msvc/release/${{ matrix.app.binary }}"
          $proc = Start-Process -FilePath $binaryPath -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "${{ matrix.app.name }} exited within 8 seconds instead of showing a window (exit code $($proc.ExitCode))."
          }
          $title = $proc.MainWindowTitle
          if ([string]::IsNullOrWhiteSpace($title)) {
            Write-Warning "${{ matrix.app.name }}: MainWindowTitle came back empty on this runner — falling back to the alive-process check."
            Start-Sleep -Seconds 2
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "${{ matrix.app.name }} exited before the fallback check completed (exit code $($proc.ExitCode))."
            }
          } elseif ($title -notlike "*${{ matrix.app.title }}*") {
            throw "${{ matrix.app.name }}: expected window title containing '${{ matrix.app.title }}' but got '$title'."
          } else {
            Write-Host "${{ matrix.app.name }}: window title confirmed: $title"
          }
          Stop-Process -Id $proc.Id -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.app.name }}-installer
          # Both Authenticode and the Tauri updater signature are mandatory.
          path: |
            ${{ matrix.app.path }}/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            ${{ matrix.app.path }}/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  build-android:
    needs: [setup, quality]
    runs-on: ubuntu-latest
    # Job-level for the same reason as build-desktop: tauri.conf.json's beforeBuildCommand
    # re-runs "npm run build" again inside both `tauri android init` and `tauri android build`
    # themselves, unconfigured, unless every step in this job carries these.
    env:
      VITE_CLOUD_API_BASE_URL: ${{ vars.VITE_CLOUD_API_BASE_URL }}
      VITE_QR_ORDER_URL: ${{ vars.VITE_QR_ORDER_URL }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        run: |
          df -h / || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          df -h / || true

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: aarch64-linux-android

      - name: Validate release configuration
        run: node .github/scripts/validate-release-config.mjs android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Build frontend (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Init Android project (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        run: npx --yes "@tauri-apps/cli@2.11.4" android init

      - name: Harden generated Android release configuration
        run: node .github/scripts/harden-android-release.mjs "${{ matrix.app.path }}/src-tauri/gen/android"

      - name: Validate locked Android dependency graph
        working-directory: ${{ matrix.app.path }}/src-tauri
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Build Android release APK (${{ matrix.app.name }})
        working-directory: ${{ matrix.app.path }}
        run: npx --yes "@tauri-apps/cli@2.11.4" android build --target aarch64

      - name: Reject build-time dependency drift
        run: git diff --exit-code -- "${{ matrix.app.path }}/src-tauri/Cargo.lock"

      - name: Sign and verify release APK
        run: bash .github/scripts/sign-android.sh "${{ matrix.app.path }}/src-tauri/gen/android"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.app.name }}-apk
          path: ${{ matrix.app.path }}/src-tauri/gen/android/verified-release/*.apk
          if-no-files-found: error

  # Closes the loop this build pipeline used to leave manual: every previous release was built
  # here, then hand-downloaded, renamed and re-uploaded as a GitHub Release one file at a time.
  # This job does that automatically, so the only thing a new feature/fix still needs by hand
  # is pasting the resulting URLs + signature into Super Admin's Publish Version form once
  # (deliberately -- nothing should reach real restaurant devices without that human decision).
  publish-release:
    needs: [setup, build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read release version
        id: version
        run: echo "version=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: downloaded

      - name: Flatten into clearly-named release assets
        env:
          APPS_CSV: ${{ needs.setup.outputs.apps_csv }}
        run: |
          set -e
          mkdir -p release-assets
          declare -A slug=( [POS]=pos [RestaurantAdmin]=pos-admin [Kiosk]=kiosk [Captain]=captain [KDS]=kds )
          IFS=',' read -ra apps <<< "$APPS_CSV"
          for app in "${apps[@]}"; do
            name="${slug[$app]}"
            exe_src=$(find "downloaded/${app}-installer" -iname "*.exe" ! -iname "*.sig" | head -n1)
            sig_src=$(find "downloaded/${app}-installer" -iname "*.exe.sig" | head -n1)
            apk_src=$(find "downloaded/${app}-apk" -iname "*.apk" | head -n1)
            cp "$exe_src" "release-assets/jamanvaar-${name}.exe"
            [ -n "$sig_src" ] || { echo "Missing updater signature" >&2; exit 1; }
            cp "$sig_src" "release-assets/jamanvaar-${name}.exe.sig"
            cp "$apk_src" "release-assets/jamanvaar-${name}.apk"
          done
          (cd release-assets && sha256sum -- *.exe *.apk > SHA256SUMS.txt)
          node .github/scripts/release-inventory.mjs
          ls -la release-assets

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JAMANVAAR v${{ steps.version.outputs.version }}
          body: Automated release build -- see commit history for what changed. Paste these files' URLs (and the matching .sig contents) into Super Admin's Publish Version form to make this version live.
          files: release-assets/*
          draft: true
          make_latest: false
