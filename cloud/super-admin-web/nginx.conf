server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Server-Sent Events (RealtimeController's /api/v1/realtime/stream) -- nginx buffers
    # proxied responses by default, which would hold every event until the buffer fills or
    # the connection closes, defeating the whole point of a live stream. proxy_buffering
    # off and a long read timeout are both required for this one route specifically.
    location /api/v1/realtime/stream {
        proxy_pass http://backend:4000/api/v1/realtime/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
    }

    # Everything else under /api/v1 -- the real REST surface.
    location /api/v1/ {
        proxy_pass http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # SPA routing fallback -- any path that isn't a real static asset or an /api/v1/ call
    # is a client-side route, served index.html and resolved by the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
