services:
  db:
    image: postgres:15-alpine
    container_name: kiosk_db
    restart: unless-stopped
    environment:
      # Bootstrap superuser only -- used by Postgres itself to initialize the cluster and
      # by docker-init-app-role.sh to create the real app role below. The application
      # itself NEVER connects as this user (see backend's own DATABASE_URL) -- it would
      # bypass Row-Level Security, and cloud/api refuses to boot in production if it ever
      # detects that it has (src/prisma/rls-role.ts).
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
      # Read by docker-init-app-role.sh (below) the one time it runs, to create the real,
      # non-superuser jamanvaar_app role the backend actually connects as.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs exactly once, only the very first time this volume is empty -- the official
      # postgres image's own documented behavior for anything in docker-entrypoint-initdb.d.
      - ./cloud/api/prisma/docker-init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    networks:
      - kiosk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Dedicated loopback port -- no conflict with the other projects' own DB containers
    # (kelviontech.in 5432, restaurent.kelviontech.in 5433, Wrench 5435).
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"

  backend:
    build:
      context: .
      dockerfile: cloud/api/Dockerfile
    container_name: kiosk_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      # jamanvaar_app, not the bootstrap postgres superuser above -- see docker-init-app-role.sh.
      - DATABASE_URL=postgresql://jamanvaar_app:${APP_DB_PASSWORD}@db:5432/jamanvaar?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env -- see scripts/generate-production-env.js}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL_DAYS=${JWT_REFRESH_TTL_DAYS:-30}
      - PRIVILEGED_REFRESH_TTL_DAYS=${PRIVILEGED_REFRESH_TTL_DAYS:-7}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must list the real console origin(s) in production}
      - TRUST_PROXY=${TRUST_PROXY:-2}
      - QR_SESSION_SECRET=${QR_SESSION_SECRET:-}
      - JAMANVAAR_SERVICE_SECRET=${JAMANVAAR_SERVICE_SECRET:-}
      - WHATSAPP_CONNECTOR_BASE_URL=${WHATSAPP_CONNECTOR_BASE_URL:-}
      - LICENSE_SIGNING_PRIVATE_KEY_B64=${LICENSE_SIGNING_PRIVATE_KEY_B64:-}
      - LICENSE_SIGNING_KEY_ID=${LICENSE_SIGNING_KEY_ID:-}
      - BACKUP_ENCRYPTION_KEY_B64=${BACKUP_ENCRYPTION_KEY_B64:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - PAYMENT_CREDENTIAL_ENCRYPTION_KEY=${PAYMENT_CREDENTIAL_ENCRYPTION_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      # Read only by `prisma/seed.ts` (via `make seed`), never by the running server itself.
      # All optional -- left unset, the seed falls back to a random Super Admin password
      # (printed once) and skips the demo restaurant entirely (src/config/seed-options.ts:
      # shouldSeedDemoData is off by default in production). Found missing on the real
      # deploy, not assumed: these were set in .env but never referenced anywhere in this
      # file, so `docker compose exec backend ...` never actually saw them.
      - SEED_SUPER_ADMIN_EMAIL=${SEED_SUPER_ADMIN_EMAIL:-}
      - SEED_SUPER_ADMIN_PASSWORD=${SEED_SUPER_ADMIN_PASSWORD:-}
      - SEED_RESET_SUPER_ADMIN_PASSWORD=${SEED_RESET_SUPER_ADMIN_PASSWORD:-false}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-}
      - SEED_DEMO_OWNER_PASSWORD=${SEED_DEMO_OWNER_PASSWORD:-}
      - SEED_RESET_DEMO_OWNER_PASSWORD=${SEED_RESET_DEMO_OWNER_PASSWORD:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kiosk_network
    mem_limit: 768m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Dedicated loopback port for health checks / direct diagnosis -- the public path is
    # always through the frontend container's own nginx (see below), never this port.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:4000"

  frontend:
    build:
      context: .
      dockerfile: cloud/super-admin-web/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: kiosk_frontend
    restart: unless-stopped
    # No host port here -- on kelviontech-prod-2 (Oracle, dedicated box, no shared
    # kelviontech-nginx-1 in front of it), the `proxy` service below is the only thing
    # bound to the host. Every app is reached through it, over the internal
    # kiosk_network, by its Docker Compose service name -- see
    # nginx/oracle-testing-proxy.conf. (On the AWS bridge box's shared-nginx pattern, this
    # service WOULD publish to 172.17.0.1:8090 instead -- see AWS_DEPLOYMENT_MASTER_PLAN.md
    # and nginx/system.kelviontech.in.conf for that production convention.)
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Terminal / customer-facing apps ─────────────────────────────────────────────────
  # None of these existed as Docker images before this pass -- only cloud/api and
  # cloud/super-admin-web were deployed anywhere (see AWS_DEPLOYMENT_MASTER_PLAN.md
  # section 4). Added here so the whole platform can be exercised online on
  # kelviontech-prod-2, not just the admin console. Each one calls cloud/api directly at
  # an ABSOLUTE origin baked in at build time (VITE_CLOUD_API_BASE_URL -- see each app's
  # src/cloud/cloudClient.ts or, for qr-guest, src/api.ts), unlike super-admin-web's
  # same-origin relative-path pattern, because these are built to run as real terminal
  # apps potentially on a different network than the API. PUBLIC_ORIGIN in .env must be
  # this box's own reachable address (e.g. http://130.210.16.150) so those baked-in
  # fetches land on the `proxy` service below and stay same-origin (no CORS needed).
  kiosk-admin:
    build:
      context: .
      dockerfile: apps/kiosk-system/kiosk-admin/Dockerfile
      args:
        - VITE_CLOUD_API_BASE_URL=${PUBLIC_ORIGIN:-}
    container_name: kiosk_kiosk_admin
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kiosk-user:
    build:
      context: .
      dockerfile: apps/kiosk-system/kiosk-user/Dockerfile
      args:
        - VITE_CLOUD_API_BASE_URL=${PUBLIC_ORIGIN:-}
    container_name: kiosk_kiosk_user
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pos:
    build:
      context: .
      dockerfile: apps/restaurant-system/pos/Dockerfile
      args:
        - VITE_CLOUD_API_BASE_URL=${PUBLIC_ORIGIN:-}
    container_name: kiosk_pos
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pos-admin:
    build:
      context: .
      dockerfile: apps/restaurant-system/pos-admin/Dockerfile
      args:
        - VITE_CLOUD_API_BASE_URL=${PUBLIC_ORIGIN:-}
        - VITE_QR_ORDER_URL=${PUBLIC_ORIGIN:-}
    container_name: kiosk_pos_admin
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  captain:
    build:
      context: .
      dockerfile: apps/restaurant-system/captain/Dockerfile
      args:
        - VITE_CLOUD_API_BASE_URL=${PUBLIC_ORIGIN:-}
    container_name: kiosk_captain
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kds:
    build:
      context: .
      dockerfile: apps/restaurant-system/kds/Dockerfile
      args:
        - VITE_CLOUD_API_BASE_URL=${PUBLIC_ORIGIN:-}
    container_name: kiosk_kds
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qr-guest:
    build:
      context: .
      dockerfile: apps/qr-guest/Dockerfile
      args:
        - VITE_CLOUD_API_BASE_URL=${PUBLIC_ORIGIN:-}
    container_name: kiosk_qr_guest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - kiosk_network
    mem_limit: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Testing-only on this box -- see nginx/oracle-testing-proxy.conf's own header comment.
  # The ONE thing bound to the host; everything above is internal-only on kiosk_network.
  proxy:
    image: nginx:1.25-alpine
    container_name: kiosk_proxy
    restart: unless-stopped
    volumes:
      - ./nginx/oracle-testing-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
      - kiosk-admin
      - kiosk-user
      - pos
      - pos-admin
      - captain
      - kds
      - qr-guest
    networks:
      - kiosk_network
    mem_limit: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kiosk_network:
    name: kiosk_network

volumes:
  postgres_data:
    name: kiosk_postgres_data
