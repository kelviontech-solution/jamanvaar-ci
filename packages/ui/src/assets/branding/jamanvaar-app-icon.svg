<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B253A"/>
      <stop offset="100%" stop-color="#071724"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27E2B"/>
      <stop offset="100%" stop-color="#D9531E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#1E3A4C" stroke-width="8"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#D9531E" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Inner Warm Accent Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#saffronGrad)" opacity="0.12"/>

  <!-- Top Cloche Handle -->
  <circle cx="256" cy="140" r="28" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <rect x="246" y="160" width="20" height="24" rx="4" fill="url(#goldGrad)"/>

  <!-- Serving Cloche Dome -->
  <path d="M 120 310 C 120 200, 392 200, 392 310 Z" fill="url(#saffronGrad)" filter="url(#shadow)"/>

  <!-- Dome Highlights & Traditional Fluting Lines -->
  <path d="M 170 300 C 180 230, 332 230, 342 300" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <path d="M 210 290 C 220 240, 292 240, 302 290" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.25"/>

  <!-- Platter / Base Tray -->
  <rect x="96" y="316" width="320" height="26" rx="13" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <rect x="126" y="344" width="260" height="14" rx="7" fill="#EAB308" opacity="0.6"/>

  <!-- Traditional Hospitality Steam / Aroma Swirls -->
  <path d="M 230 110 C 225 90, 240 75, 230 60" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256 100 C 250 80, 265 65, 256 50" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 282 110 C 275 90, 290 75, 282 60" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Saffron Accent Dot -->
  <circle cx="256" cy="400" r="10" fill="#D9531E"/>
</svg>