"$schema" = "schemas/schema.json"

[[permission]]
identifier = "allow-download-and-install"
description = "Downloads and verifies an APK through Android's DownloadManager; a separate foreground command opens the system installer."
commands.allow = ["download_and_install"]

[[permission]]
identifier = "deny-download-and-install"
description = "Denies the download_and_install command."
commands.deny = ["download_and_install"]

[[set]]
identifier = "default"
description = "Allows downloading and installing an Android app update through the system's own download manager and install prompt."
permissions = ["allow-download-and-install", "allow-get-update-status", "allow-install-downloaded"]

[[permission]]
identifier = "allow-get-update-status"
description = "Read this application's own APK download and installation status."
commands.allow = ["get_update_status"]

[[permission]]
identifier = "allow-install-downloaded"
description = "Explicitly hand the verified APK to Android's installer after saving local data."
commands.allow = ["install_downloaded"]
