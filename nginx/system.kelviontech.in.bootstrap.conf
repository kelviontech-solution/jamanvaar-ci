# ==============================================================================
# Nginx HTTP Configuration for system.kelviontech.in (bootstrap, before a cert exists)
# Lives in the SHARED kelviontech-nginx-1 container's conf.d, alongside every other
# project's own subdomain config on this box -- NOT a separate host-level nginx. Deploy
# this file to ~/kelviontech/nginx/conf.d/system.kelviontech.in.conf, confirmed working
# convention (see restaurant.kelviontech.in.conf, wrench.amitkhatri.co.in.conf in that same
# directory), then swap in system.kelviontech.in.conf once the real certificate is issued.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name system.kelviontech.in;

    # Certbot ACME Challenge directory -- served from the same shared certbot_www volume
    # every other project on this nginx container already uses.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
