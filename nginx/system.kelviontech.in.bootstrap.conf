# ==============================================================================
# system.kelviontech.in — Bootstrap Nginx Virtual Host (before a certificate exists)
# Use this first so Certbot's HTTP-01 challenge can succeed, then switch to
# system.kelviontech.in.conf once the real certificate is issued. Mirrors Wrench's own
# wrench.bootstrap.conf exactly.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name system.kelviontech.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
