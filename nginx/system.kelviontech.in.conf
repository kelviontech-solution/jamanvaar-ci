# ==============================================================================
# Nginx HTTPS Configuration for system.kelviontech.in
# Lives in the SHARED kelviontech-nginx-1 container's conf.d (~/kelviontech/nginx/conf.d/),
# alongside restaurant.kelviontech.in.conf, wrench.amitkhatri.co.in.conf etc. on this box --
# NOT a separate host-level nginx (that service is not even running here; this container,
# bound to 80/443, is the real shared front door). Same shape as restaurant.kelviontech.in's
# own config, which this followed exactly, adapted for kiosk's one container (frontend's
# own nginx already proxies /api/v1/* onward to the backend container -- see
# cloud/super-admin-web/nginx.conf), plus the one addition it needs: Server-Sent Events
# must not be buffered at this outer layer either, or the un-buffering set one layer in is
# undone right back here.
#
# Terminal/customer app location blocks added below the original two -- root (super-admin
# console, including every app's /api/v1/* calls, which land here too and get forwarded on
# by frontend's own nginx either way) is UNCHANGED, on purpose: it's the real, already
# bookmarked production entry point. Each new app gets its own subpath instead, proxying to
# its own 172.17.0.1:<port> (see docker-compose.yml's new services) -- see
# ORACLE_KELVIONTECH_PROD_2_SETUP.md's superseded standalone-proxy design for why this
# shared-front-door shape was chosen instead for this (the real, AWS) box.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name system.kelviontech.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name system.kelviontech.in;

    ssl_certificate     /etc/letsencrypt/live/system.kelviontech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.kelviontech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Server-Sent Events (RealtimeController) -- must not be buffered here either, or the
    # container's own no-buffering nginx.conf setting is undone right back by this layer.
    location /api/v1/realtime/stream {
        proxy_pass http://172.17.0.1:8090/api/v1/realtime/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    # ── Terminal / customer-facing apps (added for full-platform online testing) ────────
    # Each proxies to its own container's port on the bridge gateway -- see
    # docker-compose.yml's new services. nginx matches the longest prefix regardless of
    # declaration order, so these all correctly take priority over the catch-all `location
    # /` below even though it's listed last.
    location /kiosk-admin/ {
        proxy_pass http://172.17.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /kiosk/ {
        proxy_pass http://172.17.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /pos-admin/ {
        proxy_pass http://172.17.0.1:8094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /pos/ {
        proxy_pass http://172.17.0.1:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /captain/ {
        proxy_pass http://172.17.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /kds/ {
        proxy_pass http://172.17.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # QR guest ordering -- matches its own src/App.tsx regex
    # (/^\/q\/([A-Za-z0-9_-]{10,200})\/?$/ against window.location.pathname, which the
    # browser still shows as /q/<token> regardless of this proxy, so the prefix strip
    # below doesn't break it).
    location /q/ {
        proxy_pass http://172.17.0.1:8097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else: the SPA and the rest of the REST API (kiosk_frontend's own nginx
    # proxies /api/v1/* onward to kiosk_backend from here).
    location / {
        proxy_pass http://172.17.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
