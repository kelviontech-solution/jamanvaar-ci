# ==============================================================================
# system.kelviontech.in — Nginx Virtual Host
# Proxies to the kiosk_frontend container on port 8090 (which itself proxies /api/v1/* to
# kiosk_backend over the Docker network -- see cloud/super-admin-web/nginx.conf). Mirrors
# Wrench's own wrench.amitkhatri.co.in.conf exactly, same shared-nginx-front-door pattern.
# ==============================================================================

# HTTP: redirect everything to HTTPS, preserving the ACME challenge path for renewal.
server {
    listen 80;
    listen [::]:80;
    server_name system.kelviontech.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate SSL, reverse proxy to the kiosk stack.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name system.kelviontech.in;

    client_max_body_size 25M;

    ssl_certificate     /etc/letsencrypt/live/system.kelviontech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.kelviontech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Server-Sent Events (RealtimeController) -- must not be buffered at this outer layer
    # either, or the container's own no-buffering nginx.conf setting is undone right back
    # by this one. See cloud/super-admin-web/nginx.conf's own comment for why this route
    # needs this at all.
    location /api/v1/realtime/stream {
        proxy_pass http://172.17.0.1:8090/api/v1/realtime/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    # Everything else: the SPA and the rest of the REST API.
    location / {
        proxy_pass http://172.17.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
