# ==============================================================================
# Testing-only reverse proxy for kelviontech-prod-2 (Oracle, 130.210.16.150).
# Unlike the AWS bridge box, this is a DEDICATED box with no shared nginx+certbot
# container in front of it -- this `proxy` service in docker-compose.yml IS the box's only
# thing bound to host port 80, routing every app by path so the whole platform can be
# tested online from one IP with zero DNS/cert setup. See
# ORACLE_KELVIONTECH_PROD_2_SETUP.md for the full picture; this routing scheme is NOT the
# same as production's system.kelviontech.in (nginx/system.kelviontech.in.conf), which
# serves only super-admin-web at the root through a shared front door on the AWS box.
#
# Every frontend app below is built with VITE_CLOUD_API_BASE_URL baked in at image build
# time to this box's own public origin (see docker-compose.yml's build args) -- so their
# fetches to /api/v1/... are same-origin requests against THIS proxy, not cross-origin,
# and CORS_ALLOWED_ORIGINS in .env only ever needs that one origin.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;

    # Server-Sent Events (RealtimeController) -- must not be buffered at this outer layer.
    location /api/v1/realtime/stream {
        proxy_pass http://backend:4000/api/v1/realtime/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
    }

    # The real REST surface -- every app's cloudClient.ts/api.ts calls this path directly.
    location /api/v1/ {
        proxy_pass http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Super Admin Console -- production root (system.kelviontech.in), subpath here only
    # because this box also hosts everything else for testing.
    location /admin/ {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kiosk-admin/ {
        proxy_pass http://kiosk-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kiosk/ {
        proxy_pass http://kiosk-user:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pos-admin/ {
        proxy_pass http://pos-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deliberately after /pos-admin/ -- nginx matches the longest/most specific prefix
    # location regardless of file order, but keeping them adjacent here avoids confusion.
    location /pos/ {
        proxy_pass http://pos:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /captain/ {
        proxy_pass http://captain:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kds/ {
        proxy_pass http://kds:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QR guest ordering app owns the root -- its own vite.config.ts comment requires this
    # ("served at the site root, so /q/<token> works on any host"). Everything that isn't
    # one of the explicit prefixes above falls through to it.
    location / {
        proxy_pass http://qr-guest:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
