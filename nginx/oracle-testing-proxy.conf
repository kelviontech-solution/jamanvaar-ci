# ==============================================================================
# Reverse proxy for a full, self-contained kiosk stack on a DEDICATED box (no shared
# kelviontech-nginx-1 in front of it, unlike the AWS box -- see
# nginx/system.kelviontech.in.conf for that pattern instead). This is
# kelviontech-prod-2 (Oracle, reserved IP 130.210.16.150), now the real
# system.kelviontech.in production target: this `proxy` service (docker-compose.yml,
# `oracle` Compose profile) is the ONLY thing bound to the host, routing every app by
# path over the internal kiosk_network via each service's own Compose name -- no
# 172.17.0.1:<port> bridge-gateway publishing needed here.
#
# Root (/) is super-admin-web, matching AWS's existing system.kelviontech.in
# convention exactly (same bookmarked URL keeps working).
#
# Every frontend app is built with VITE_CLOUD_API_BASE_URL baked in at image build time
# to PUBLIC_ORIGIN (.env) -- https://system.kelviontech.in. Since every app shares that
# one origin via this one proxy, those build-time-baked absolute fetches to /api/v1/...
# stay same-origin -- no CORS needed, same effect super-admin-web gets from its own
# relative-path pattern.
#
# Real TLS, not a placeholder -- a Let's Encrypt cert for system.kelviontech.in was
# issued via `docker compose run --rm certbot certonly --webroot ...` once DNS actually
# pointed here, and lives under the certbot_conf volume this file reads from. Renewal:
# `docker compose run --rm certbot renew` (90-day certs) needs a periodic host cron
# running that same command, then an nginx reload -- not set up automatically by this
# file.
#
# Every proxy_pass target below uses a `set $upstream_x <name>;` variable, not a bare
# `proxy_pass http://<name>:80/;` hostname -- confirmed live, not a precaution: a bare
# hostname is resolved via getaddrinfo() ONCE when nginx starts and the IP is cached in
# memory for that worker's entire lifetime. Docker assigns a NEW internal IP to a
# container every time it's recreated OR auto-restarted (e.g. by `restart:
# unless-stopped` after a crash) -- with a bare hostname, nginx keeps routing to the
# dead old IP forever ("connect() failed (113: Host is unreachable)", a real 502 this
# caused in production on 2026-10-05, traced to kiosk-user restarting after a stuck UPI
# payment interaction) until something manually restarts THIS proxy container too. A
# variable forces nginx to treat it as dynamic and actually re-resolve through the
# `resolver` directive below (Docker's embedded DNS at 127.0.0.11, cached only `valid`
# seconds), so any app's container can restart on its own without taking this proxy
# down with it.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name system.kelviontech.in;

    # Certbot HTTP-01 domain validation -- must stay reachable over plain HTTP even
    # after a cert exists (renewal re-validates the same way).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name system.kelviontech.in;

    ssl_certificate     /etc/letsencrypt/live/system.kelviontech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system.kelviontech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Docker's embedded DNS -- every location below resolves its upstream through this,
    # re-checking every 10s, instead of caching whatever IP existed at nginx startup.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Server-Sent Events (RealtimeController) -- must not be buffered at this outer layer.
    location /api/v1/realtime/stream {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:4000/api/v1/realtime/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
    }

    # The real REST surface -- every app's cloudClient.ts/api.ts calls this path directly.
    location /api/v1/ {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location /kiosk-admin/ {
        set $upstream_kiosk_admin kiosk-admin;
        proxy_pass http://$upstream_kiosk_admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /kiosk/ {
        set $upstream_kiosk_user kiosk-user;
        proxy_pass http://$upstream_kiosk_user:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /pos-admin/ {
        set $upstream_pos_admin pos-admin;
        proxy_pass http://$upstream_pos_admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /pos/ {
        set $upstream_pos pos;
        proxy_pass http://$upstream_pos:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /captain/ {
        set $upstream_captain captain;
        proxy_pass http://$upstream_captain:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /kds/ {
        set $upstream_kds kds;
        proxy_pass http://$upstream_kds:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # QR guest ordering -- matches its own src/App.tsx regex
    # (/^\/q\/([A-Za-z0-9_-]{10,200})\/?$/ against window.location.pathname, which the
    # browser still shows as /q/<token> regardless of this proxy, so the prefix strip
    # below doesn't break it).
    location /q/ {
        set $upstream_qr_guest qr-guest;
        proxy_pass http://$upstream_qr_guest:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Super Admin Console -- the real production root, matching AWS's existing
    # system.kelviontech.in convention exactly.
    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
