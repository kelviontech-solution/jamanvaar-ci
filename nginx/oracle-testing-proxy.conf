# ==============================================================================
# Reverse proxy for a full, self-contained kiosk stack on a DEDICATED box (no shared
# kelviontech-nginx-1 in front of it, unlike the AWS box -- see
# nginx/system.kelviontech.in.conf for that pattern instead). Written for
# kelviontech-prod-2 (Oracle, reserved IP 130.210.16.150) but works on any dedicated box:
# this `proxy` service (docker-compose.yml, `oracle` Compose profile) is the ONLY thing
# bound to the host, routing every app by path over the internal kiosk_network via each
# service's own Compose name -- no 172.17.0.1:<port> bridge-gateway publishing needed here.
#
# Every frontend app is built with VITE_CLOUD_API_BASE_URL baked in at image build time
# to PUBLIC_ORIGIN (.env) -- this box's own reachable address, e.g. http://130.210.16.150.
# Since every app (including super-admin-web at root) is served from that SAME origin via
# this one proxy, those build-time-baked absolute fetches to /api/v1/... stay same-origin
# -- no CORS needed, same effect super-admin-web gets from its own relative-path pattern.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;

    # Server-Sent Events (RealtimeController) -- must not be buffered at this outer layer.
    location /api/v1/realtime/stream {
        proxy_pass http://backend:4000/api/v1/realtime/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1d;
    }

    # The real REST surface -- every app's cloudClient.ts/api.ts calls this path directly.
    location /api/v1/ {
        proxy_pass http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Super Admin Console -- production root (system.kelviontech.in on AWS), subpath here
    # only because this box also hosts everything else on one origin for testing.
    location /admin/ {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kiosk-admin/ {
        proxy_pass http://kiosk-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kiosk/ {
        proxy_pass http://kiosk-user:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pos-admin/ {
        proxy_pass http://pos-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pos/ {
        proxy_pass http://pos:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /captain/ {
        proxy_pass http://captain:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kds/ {
        proxy_pass http://kds:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # QR guest ordering -- matches its own src/App.tsx regex
    # (/^\/q\/([A-Za-z0-9_-]{10,200})\/?$/ against window.location.pathname, which the
    # browser still shows as /q/<token> regardless of this proxy, so the prefix strip
    # below doesn't break it).
    location /q/ {
        proxy_pass http://qr-guest:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else falls through to qr-guest too -- its own SPA fallback (nginx.conf's
    # try_files) serves index.html regardless, and its client-side regex only ever matches
    # real /q/<token> paths, so an unmatched root request just shows its default screen.
    location / {
        proxy_pass http://qr-guest:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
