# The outer proxy serves this app at /q/ and removes that prefix before forwarding.
# Vite emits /q/assets/ URLs so scripts stay with the guest app on the shared origin.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate the SPA document after releases; hashed assets remain immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
