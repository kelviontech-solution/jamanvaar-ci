# Served at the site ROOT by the outer proxy (nginx/oracle-testing-proxy.conf) -- see this
# app's own package.json description: "the customer QR ordering web app... Web only" and
# vite.config.ts's comment that it's "served at the site root, so /q/<token> works on any
# host." SPA fallback below makes any /q/<token> path resolve to index.html.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
