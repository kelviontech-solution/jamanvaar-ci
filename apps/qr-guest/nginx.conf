# The outer proxy serves this app at /q/ and removes that prefix before forwarding.
# Vite emits /q/assets/ URLs so scripts stay with the guest app on the shared origin.
upstream qr_metadata_backend {
    server backend:4000;
}
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Social crawlers receive tenant-specific metadata in the initial HTML, without JavaScript.
    # The outer /q/ prefix is already stripped. Only this published-page route uses SSI.
    location ~ "^/site/([A-Za-z0-9_-]{6,80})/?$" {
        set $qr_site_slug $1;
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-store" always;
        try_files /site.html =404;
    }
    location ~ "^/_restaurant-head/([A-Za-z0-9_-]{6,80})$" {
        internal;
        proxy_pass http://qr_metadata_backend/api/v1/public/qr/sites/$1/head;
        proxy_set_header Accept "text/html";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate the SPA document after releases; hashed assets remain immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
