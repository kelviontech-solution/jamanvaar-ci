[package]
name = "jamanvaar-kds"
version = "1.0.0"
description = "JAMANVAAR Kitchen Display System — Desktop Application"
authors = ["Kelviontech Systems <info@kelviontech.com>"]
edition = "2021"

[lib]
name = "jamanvaar_kds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auto-update is desktop-only (Tauri's updater plugin has no Android/iOS support) --
# scoped to the Windows target so mobile builds never try to pull these in.
[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Android's own equivalent of the Windows updater above -- see packages/tauri-plugin-apk-updater.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-apk-updater = { path = "../../../../packages/tauri-plugin-apk-updater" }
