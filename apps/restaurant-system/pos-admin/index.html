<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // The same deployed bundle serves both product roots. Relative build assets must resolve
      // from the application root when opening a deep link, not from the nested page directory.
      const adminRoot = location.pathname.split('/')[1];
      const adminBase = document.createElement('base');
      adminBase.href = ['pos-admin', 'restaurant-admin', 'kiosk-admin'].includes(adminRoot) ? '/' + adminRoot + '/' : '/';
      document.head.appendChild(adminBase);
    </script>
    <link rel="manifest" href="./manifest.webmanifest?v=a967a1e97fb5" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=a967a1e97fb5" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=a967a1e97fb5" />
    
    
    
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JAMANVAAR Admin — Restaurant Operations & Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
