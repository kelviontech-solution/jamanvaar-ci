[package]
name = "jamanvaar-kiosk-user"
version = "1.0.0"
description = "JAMANVAAR Self-Ordering Kiosk Desktop Application"
authors = ["Kelviontech Systems <info@kelviontech.com>"]
edition = "2021"

[lib]
name = "jamanvaar_kiosk_user_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
