# Static-only -- no /api/v1 proxy block here, unlike cloud/super-admin-web/nginx.conf. This
# app calls an ABSOLUTE API host baked in at build time (VITE_CLOUD_API_BASE_URL), so its
# fetches go straight to the shared outer proxy container, never through this nginx.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
